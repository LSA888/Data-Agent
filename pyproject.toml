[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LSA888", email = "3460417088@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "asyncmy>=0.2.14",
    "cryptography>=50.0.0",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.141.1",
    "jieba>=0.42.1",
    "langchain>=1.3.15",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "omegaconf>=2.3.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
data-agent = "data_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
